name: Deploy VideoGenerator Container App

on:
  push:
    branches:
      - master
    paths:
      - 'containers/VideoGenerator/**'
      - '.github/workflows/deploy-video-generator-aca.yml'
  workflow_dispatch:

env:
  AZURE_RESOURCE_GROUP: 'ai-newspaper-rg'
  AZURE_CONTAINER_APP_NAME: 'ai-newspaper-video-generator'
  DOCKER_REGISTRY_NAME: 'ainewspapervideogen'
  IMAGE_NAME: 'videogenerator'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Login to Azure
      uses: azure/login@v2
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    - name: Login to Azure Container Registry
      run: |
        az acr login --name ${{ env.DOCKER_REGISTRY_NAME }}

    - name: Build and push Docker image
      run: |
        cd containers/VideoGenerator
        az acr build \
          --registry ${{ env.DOCKER_REGISTRY_NAME }} \
          --image ${{ env.IMAGE_NAME }}:${{ github.sha }} \
          --image ${{ env.IMAGE_NAME }}:latest \
          --file Dockerfile \
          .

    - name: Get Storage Connection String and App Insights
      id: config
      run: |
        STORAGE_CONNECTION=$(az storage account show-connection-string \
          --name ainewspaperstorage \
          --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
          --query connectionString \
          --output tsv)
        echo "::add-mask::$STORAGE_CONNECTION"
        echo "connection_string=$STORAGE_CONNECTION" >> $GITHUB_OUTPUT

        APP_INSIGHTS_CONNECTION=$(az monitor app-insights component show \
          --app ai-newspaper-app-insights \
          --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
          --query connectionString \
          --output tsv)
        echo "::add-mask::$APP_INSIGHTS_CONNECTION"
        echo "app_insights_connection_string=$APP_INSIGHTS_CONNECTION" >> $GITHUB_OUTPUT

    - name: Update Container App
      run: |
        az containerapp update \
          --name ${{ env.AZURE_CONTAINER_APP_NAME }} \
          --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
          --image ${{ env.DOCKER_REGISTRY_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:latest \
          --set-env-vars \
            "AzureWebJobsStorage=${{ steps.config.outputs.connection_string }}" \
            "BLOB_CONTAINER_NAME=batch-runs" \
            "APPLICATIONINSIGHTS_CONNECTION_STRING=${{ steps.config.outputs.app_insights_connection_string }}"

    - name: Get Container App URL
      run: |
        APP_URL=$(az containerapp show \
          --name ${{ env.AZURE_CONTAINER_APP_NAME }} \
          --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
          --query properties.configuration.ingress.fqdn \
          --output tsv)
        echo "Container App URL: https://$APP_URL"
        echo "Health endpoint: https://$APP_URL/health"
        echo "Generate endpoint: https://$APP_URL/api/generate"

    - name: Logout from Azure
      run: az logout
      if: always()
