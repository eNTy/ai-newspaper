name: Deploy VideoGenerator

on:
  push:
    branches:
      - master
    paths:
      - 'lambdas/VideoGenerator/**'
      - '.github/workflows/deploy-video-generator.yml'
  workflow_dispatch:

env:
  AZURE_RESOURCE_GROUP: 'ai-newspaper-rg'
  AZURE_FUNCTIONAPP_NAME: 'ai-newspaper-video-generator'
  DOCKER_IMAGE_NAME: 'ainewspapervideogen'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Login to Azure
      uses: azure/login@v2
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    - name: Login to Azure Container Registry
      run: |
        az acr login --name ${{ env.DOCKER_IMAGE_NAME }}

    - name: Build and push Docker image
      run: |
        cd lambdas/VideoGenerator
        az acr build \
          --registry ${{ env.DOCKER_IMAGE_NAME }} \
          --image videogenerator:${{ github.sha }} \
          --image videogenerator:latest \
          --file Dockerfile \
          .

    - name: Deploy to Azure Function App
      run: |
        az functionapp config container set \
          --name ${{ env.AZURE_FUNCTIONAPP_NAME }} \
          --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
          --docker-custom-image-name ${{ env.DOCKER_IMAGE_NAME }}.azurecr.io/videogenerator:latest \
          --docker-registry-server-url https://${{ env.DOCKER_IMAGE_NAME }}.azurecr.io

    - name: Configure App Settings
      run: |
        STORAGE_CONNECTION=$(az storage account show-connection-string \
          --name ainewspaperstorage \
          --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
          --query connectionString \
          --output tsv)

        az functionapp config appsettings set \
          --name ${{ env.AZURE_FUNCTIONAPP_NAME }} \
          --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
          --settings \
            "AzureWebJobsStorage=$STORAGE_CONNECTION" \
            "BLOB_CONTAINER_NAME=batch-runs"

        az functionapp cors add \
          --name ${{ env.AZURE_FUNCTIONAPP_NAME }} \
          --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
          --allowed-origins https://portal.azure.com

    - name: Restart Function App
      run: |
        az functionapp restart \
          --name ${{ env.AZURE_FUNCTIONAPP_NAME }} \
          --resource-group ${{ env.AZURE_RESOURCE_GROUP }}

    - name: Logout from Azure
      run: az logout
      if: always()
