name: Deploy NewspaperOrchestrator

on:
  push:
    branches:
      - master
    paths:
      - 'lambdas/NewspaperOrchestrator/**'
      - '.github/workflows/deploy-orchestrator.yml'
  workflow_dispatch:

env:
  DOTNET_VERSION: '8.0.x'
  AZURE_RESOURCE_GROUP: 'ai-newspaper-rg'
  AZURE_FUNCTIONAPP_NAME: 'ai-newspaper-orchestrator'
  DEFAULT_RSS_URL: 'https://ct24.ceskatelevize.cz/rss/tema/vyber-redakce-84313'
  BLOB_CONTAINER_NAME: 'batch-runs'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Login to Azure
      uses: azure/login@v2
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    - name: Build NewspaperOrchestrator
      run: |
        cd lambdas/NewspaperOrchestrator
        dotnet restore
        dotnet build --configuration Release
        dotnet publish --configuration Release --output ./output

    - name: Deploy to Azure Function App
      uses: Azure/functions-action@v1
      with:
        app-name: ${{ env.AZURE_FUNCTIONAPP_NAME }}
        package: lambdas/NewspaperOrchestrator/output

    - name: Get Function URLs and Keys
      id: get-urls
      run: |
        # Wait for functions to be available (they might still be starting)
        echo "Waiting for functions to be available..."
        sleep 30

        # Get RssProcessor URL and key with retry
        echo "Getting RssProcessor URL and key..."
        for i in {1..5}; do
          RSS_URL=$(az functionapp function show \
            -g ${{ env.AZURE_RESOURCE_GROUP }} \
            -n ai-newspaper-rss-processor \
            --function-name RssProcessor \
            --query invokeUrlTemplate -o tsv 2>/dev/null || echo "")

          if [ -n "$RSS_URL" ]; then
            RSS_KEY=$(az functionapp function keys list \
              -g ${{ env.AZURE_RESOURCE_GROUP }} \
              -n ai-newspaper-rss-processor \
              --function-name RssProcessor \
              --query default -o tsv 2>/dev/null || echo "")
            if [ -n "$RSS_KEY" ]; then
              break
            fi
          fi
          echo "Retry $i/5 for RssProcessor..."
          sleep 10
        done

        # Get ArticleSimplifier URL and key with retry
        echo "Getting ArticleSimplifier URL and key..."
        for i in {1..5}; do
          SIMPLIFIER_URL=$(az functionapp function show \
            -g ${{ env.AZURE_RESOURCE_GROUP }} \
            -n ai-newspaper-article-simplifier \
            --function-name ArticleSimplifier \
            --query invokeUrlTemplate -o tsv 2>/dev/null || echo "")

          if [ -n "$SIMPLIFIER_URL" ]; then
            SIMPLIFIER_KEY=$(az functionapp function keys list \
              -g ${{ env.AZURE_RESOURCE_GROUP }} \
              -n ai-newspaper-article-simplifier \
              --function-name ArticleSimplifier \
              --query default -o tsv 2>/dev/null || echo "")
            if [ -n "$SIMPLIFIER_KEY" ]; then
              break
            fi
          fi
          echo "Retry $i/5 for ArticleSimplifier..."
          sleep 10
        done

        # Get ImageGenerator URL and key with retry
        echo "Getting ImageGenerator URL and key..."
        for i in {1..5}; do
          IMAGE_URL=$(az functionapp function show \
            -g ${{ env.AZURE_RESOURCE_GROUP }} \
            -n ai-newspaper-image-generator \
            --function-name ImageGenerator \
            --query invokeUrlTemplate -o tsv 2>/dev/null || echo "")

          if [ -n "$IMAGE_URL" ]; then
            IMAGE_KEY=$(az functionapp function keys list \
              -g ${{ env.AZURE_RESOURCE_GROUP }} \
              -n ai-newspaper-image-generator \
              --function-name ImageGenerator \
              --query default -o tsv 2>/dev/null || echo "")
            if [ -n "$IMAGE_KEY" ]; then
              break
            fi
          fi
          echo "Retry $i/5 for ImageGenerator..."
          sleep 10
        done

        # Get TextToSpeech URL and key with retry
        echo "Getting TextToSpeech URL and key..."
        for i in {1..5}; do
          TTS_URL=$(az functionapp function show \
            -g ${{ env.AZURE_RESOURCE_GROUP }} \
            -n ai-newspaper-text-to-speech \
            --function-name TextToSpeech \
            --query invokeUrlTemplate -o tsv 2>/dev/null || echo "")

          if [ -n "$TTS_URL" ]; then
            TTS_KEY=$(az functionapp function keys list \
              -g ${{ env.AZURE_RESOURCE_GROUP }} \
              -n ai-newspaper-text-to-speech \
              --function-name TextToSpeech \
              --query default -o tsv 2>/dev/null || echo "")
            if [ -n "$TTS_KEY" ]; then
              break
            fi
          fi
          echo "Retry $i/5 for TextToSpeech..."
          sleep 10
        done

        # Get VideoGenerator Container App URL
        echo "Getting VideoGenerator Container App URL..."
        VIDEO_GEN_FQDN=$(az containerapp show \
          --name ai-newspaper-video-generator \
          --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
          --query properties.configuration.ingress.fqdn \
          --output tsv 2>/dev/null || echo "")

        if [ -n "$VIDEO_GEN_FQDN" ]; then
          VIDEO_GEN_URL="https://${VIDEO_GEN_FQDN}/api/generate"
        else
          VIDEO_GEN_URL=""
        fi

        # Verify all values were retrieved
        if [ -z "$RSS_URL" ] || [ -z "$RSS_KEY" ]; then
          echo "ERROR: Failed to get RssProcessor URL or key"
          exit 1
        fi
        if [ -z "$SIMPLIFIER_URL" ] || [ -z "$SIMPLIFIER_KEY" ]; then
          echo "ERROR: Failed to get ArticleSimplifier URL or key"
          exit 1
        fi
        if [ -z "$IMAGE_URL" ] || [ -z "$IMAGE_KEY" ]; then
          echo "ERROR: Failed to get ImageGenerator URL or key"
          exit 1
        fi
        if [ -z "$TTS_URL" ] || [ -z "$TTS_KEY" ]; then
          echo "ERROR: Failed to get TextToSpeech URL or key"
          exit 1
        fi
        if [ -z "$VIDEO_GEN_URL" ]; then
          echo "ERROR: Failed to get VideoGenerator Container App URL"
          exit 1
        fi

        echo "RSS_PROCESSOR_URL=${RSS_URL}?code=${RSS_KEY}" >> $GITHUB_OUTPUT
        echo "ARTICLE_SIMPLIFIER_URL=${SIMPLIFIER_URL}?code=${SIMPLIFIER_KEY}" >> $GITHUB_OUTPUT
        echo "IMAGE_GENERATOR_URL=${IMAGE_URL}?code=${IMAGE_KEY}" >> $GITHUB_OUTPUT
        echo "TEXT_TO_SPEECH_URL=${TTS_URL}?code=${TTS_KEY}" >> $GITHUB_OUTPUT
        echo "VIDEO_GENERATOR_URL=${VIDEO_GEN_URL}" >> $GITHUB_OUTPUT

        echo "Successfully retrieved all function URLs and keys"

    - name: Configure App Settings
      run: |
        az functionapp config appsettings set \
          --name ${{ env.AZURE_FUNCTIONAPP_NAME }} \
          --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
          --settings \
            "RSS_PROCESSOR_URL=${{ steps.get-urls.outputs.RSS_PROCESSOR_URL }}" \
            "ARTICLE_SIMPLIFIER_URL=${{ steps.get-urls.outputs.ARTICLE_SIMPLIFIER_URL }}" \
            "IMAGE_GENERATOR_URL=${{ steps.get-urls.outputs.IMAGE_GENERATOR_URL }}" \
            "TEXT_TO_SPEECH_URL=${{ steps.get-urls.outputs.TEXT_TO_SPEECH_URL }}" \
            "VIDEO_GENERATOR_URL=${{ steps.get-urls.outputs.VIDEO_GENERATOR_URL }}" \
            "BLOB_CONTAINER_NAME=${{ env.BLOB_CONTAINER_NAME }}" \
            "DEFAULT_RSS_URL=${{ env.DEFAULT_RSS_URL }}"

        az functionapp cors add \
          --name ${{ env.AZURE_FUNCTIONAPP_NAME }} \
          --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
          --allowed-origins https://portal.azure.com

    - name: Logout from Azure
      run: az logout
      if: always()