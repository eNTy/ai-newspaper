name: Deploy NewspaperOrchestrator

on:
  push:
    branches:
      - master
    paths:
      - 'lambdas/NewspaperOrchestrator/**'
      - '.github/workflows/deploy-orchestrator.yml'
  workflow_dispatch:

env:
  DOTNET_VERSION: '8.0.x'
  AZURE_RESOURCE_GROUP: 'ai-newspaper-rg'
  AZURE_FUNCTIONAPP_NAME: 'ai-newspaper-orchestrator'
  BLOB_CONTAINER_NAME: 'batch-runs'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Login to Azure
      uses: azure/login@v2
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    - name: Build NewspaperOrchestrator
      run: |
        cd lambdas/NewspaperOrchestrator
        dotnet restore
        dotnet build --configuration Release
        dotnet publish --configuration Release --output ./output

    - name: Get VideoGenerator Container App URL
      id: get-urls
      run: |
        VIDEO_GEN_FQDN=$(az containerapp show \
          --name ai-newspaper-video-generator \
          --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
          --query properties.configuration.ingress.fqdn \
          --output tsv 2>/dev/null || echo "")

        if [ -z "$VIDEO_GEN_FQDN" ]; then
          echo "ERROR: Failed to get VideoGenerator Container App URL"
          exit 1
        fi

        echo "VIDEO_GENERATOR_URL=https://${VIDEO_GEN_FQDN}" >> $GITHUB_OUTPUT
        echo "Successfully retrieved VideoGenerator URL"

    - name: Configure App Settings
      run: |
        az functionapp config appsettings set \
          --name ${{ env.AZURE_FUNCTIONAPP_NAME }} \
          --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
          --settings \
            "OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}" \
            "VIDEO_GENERATOR_URL=${{ steps.get-urls.outputs.VIDEO_GENERATOR_URL }}" \
            "BLOB_CONTAINER_NAME=${{ env.BLOB_CONTAINER_NAME }}" \
            "DEFAULT_RSS_URL=${{ secrets.DEFAULT_RSS_URL }}" \
            "INSTAGRAM_ACCESS_TOKEN=${{ secrets.INSTAGRAM_ACCESS_TOKEN }}" \
            "INSTAGRAM_API_VERSION=v24.0" \
            "INSTAGRAM_ACCOUNT_ID_12=${{ secrets.INSTAGRAM_ACCOUNT_ID_12 }}" \
            "INSTAGRAM_ACCOUNT_ID_16=${{ secrets.INSTAGRAM_ACCOUNT_ID_16 }}" \
            "INSTAGRAM_ACCOUNT_ID_35=${{ secrets.INSTAGRAM_ACCOUNT_ID_35 }}" \
            "INSTAGRAM_ACCOUNT_ID_65=${{ secrets.INSTAGRAM_ACCOUNT_ID_65 }}" \
            "EMAIL_CONNECTION_STRING=${{ secrets.EMAIL_CONNECTION_STRING }}" \
            "NOTIFICATION_EMAIL_TO=${{ secrets.NOTIFICATION_EMAIL_TO }}" \
            "NOTIFICATION_EMAIL_FROM=${{ secrets.NOTIFICATION_EMAIL_FROM }}"

        az functionapp cors add \
          --name ${{ env.AZURE_FUNCTIONAPP_NAME }} \
          --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
          --allowed-origins https://portal.azure.com

    - name: Deploy to Azure Function App
      uses: Azure/functions-action@v1
      with:
        app-name: ${{ env.AZURE_FUNCTIONAPP_NAME }}
        package: lambdas/NewspaperOrchestrator/output

    - name: Logout from Azure
      run: az logout
      if: always()
