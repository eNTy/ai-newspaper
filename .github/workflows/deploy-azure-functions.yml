name: Deploy Azure Functions

on:
  push:
    branches:
      - master
    paths:
      - 'lambdas/**'
      - '.github/workflows/deploy-azure-functions.yml'
  workflow_dispatch:

env:
  #DEFAULT_RSS_URL: 'https://www.ceskenoviny.cz/sluzby/rss/zpravy.php'
  DEFAULT_RSS_URL: 'https://ct24.ceskatelevize.cz/rss/tema/vyber-redakce-84313'
  BLOB_CONTAINER_NAME: 'batch-runs'
  DOTNET_VERSION: '8.0.x'
  AZURE_RESOURCE_GROUP: 'ai-newspaper-rg'
  AZURE_LOCATION: 'westeurope'
  AZURE_FUNCTIONAPP_RSS_PROCESSOR: 'ai-newspaper-rss-processor'
  AZURE_FUNCTIONAPP_ARTICLE_SIMPLIFIER: 'ai-newspaper-article-simplifier'
  AZURE_FUNCTIONAPP_IMAGE_GENERATOR: 'ai-newspaper-image-generator'
  AZURE_FUNCTIONAPP_ORCHESTRATOR: 'ai-newspaper-orchestrator'  

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest    

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Login to Azure
      uses: azure/login@v2
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    # Deploy RssProcessor
    - name: Build RssProcessor
      run: |
        cd lambdas/RssProcessor
        dotnet publish --configuration Release --output ./output

    - name: Deploy RssProcessor to Azure
      uses: Azure/functions-action@v1
      with:
        app-name: ${{ env.AZURE_FUNCTIONAPP_RSS_PROCESSOR }}
        package: lambdas/RssProcessor/output

    - name: Configure RssProcessor App Settings
      run: |
        az functionapp config appsettings set \
          --name ${{ env.AZURE_FUNCTIONAPP_RSS_PROCESSOR }} \
          --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
          --settings "OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}"

        az functionapp cors add \
          --name ${{ env.AZURE_FUNCTIONAPP_RSS_PROCESSOR }} \
          --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
          --allowed-origins https://portal.azure.com

    # Deploy ArticleSimplifier
    - name: Build ArticleSimplifier
      run: |
        cd lambdas/ArticleSimplifier
        dotnet publish --configuration Release --output ./output

    - name: Deploy ArticleSimplifier to Azure
      uses: Azure/functions-action@v1
      with:
        app-name: ${{ env.AZURE_FUNCTIONAPP_ARTICLE_SIMPLIFIER }}
        package: lambdas/ArticleSimplifier/output

    - name: Configure ArticleSimplifier App Settings
      run: |
        az functionapp config appsettings set \
          --name ${{ env.AZURE_FUNCTIONAPP_ARTICLE_SIMPLIFIER }} \
          --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
          --settings "OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}"

        az functionapp cors add \
          --name ${{ env.AZURE_FUNCTIONAPP_ARTICLE_SIMPLIFIER }} \
          --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
          --allowed-origins https://portal.azure.com

    # Deploy ImageGenerator
    - name: Build ImageGenerator
      run: |
        cd lambdas/ImageGenerator
        dotnet publish --configuration Release --output ./output

    - name: Deploy ImageGenerator to Azure
      uses: Azure/functions-action@v1
      with:
        app-name: ${{ env.AZURE_FUNCTIONAPP_IMAGE_GENERATOR }}
        package: lambdas/ImageGenerator/output

    - name: Configure ImageGenerator App Settings
      run: |
        az functionapp config appsettings set \
          --name ${{ env.AZURE_FUNCTIONAPP_IMAGE_GENERATOR }} \
          --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
          --settings \
            "OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}" \
            "BLOB_CONTAINER_NAME=${{ env.BLOB_CONTAINER_NAME }}" \

        az functionapp cors add \
          --name ${{ env.AZURE_FUNCTIONAPP_IMAGE_GENERATOR }} \
          --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
          --allowed-origins https://portal.azure.com

    # Deploy NewspaperOrchestrator
    - name: Build NewspaperOrchestrator
      run: |
        cd lambdas/NewspaperOrchestrator
        dotnet publish --configuration Release --output ./output

    - name: Deploy NewspaperOrchestrator to Azure
      uses: Azure/functions-action@v1
      with:
        app-name: ${{ env.AZURE_FUNCTIONAPP_ORCHESTRATOR }}
        package: lambdas/NewspaperOrchestrator/output

    - name: Configure NewspaperOrchestrator App Settings
      run: |
        az functionapp config appsettings set \
          --name ${{ env.AZURE_FUNCTIONAPP_ORCHESTRATOR }} \
          --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
          --settings \
            "RSS_PROCESSOR_URL=$($FUNCTION_URL --function-name RssProcessor -n ai-newspaper-rss-processor --query invokeUrlTemplate -o tsv)?code=$($FUNCTION_KEY --function-name RssProcessor -n ai-newspaper-rss-processor --query default -o tsv)" \
            "ARTICLE_SIMPLIFIER_URL=https://${{ env.AZURE_FUNCTIONAPP_ARTICLE_SIMPLIFIER }}.azurewebsites.net/api/ArticleSimplifier" \
            "IMAGE_GENERATOR_URL=https://${{ env.AZURE_FUNCTIONAPP_IMAGE_GENERATOR }}.azurewebsites.net/api/ImageGenerator" \
            "BLOB_CONTAINER_NAME=${{ env.BLOB_CONTAINER_NAME }}" \
            "DEFAULT_RSS_URL=${{ env.DEFAULT_RSS_URL }}" \

        az functionapp cors add \
          --name ${{ env.AZURE_FUNCTIONAPP_ORCHESTRATOR }} \
          --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
          --allowed-origins https://portal.azure.com

        env: 
          FUNCTION_URL: az functionapp function show -g ${{ env.AZURE_RESOURCE_GROUP }}
          FUNCTION_KEY: az functionapp function keys list -g ${{ env.AZURE_RESOURCE_GROUP }}
          

    - name: Logout from Azure
      run: az logout
