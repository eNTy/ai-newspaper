name: Deploy All Azure Functions (Manual)

on:
  workflow_dispatch:

jobs:
  deploy-rss-processor:
    uses: ./.github/workflows/deploy-rss-processor.yml
    secrets: inherit

  deploy-article-simplifier:
    uses: ./.github/workflows/deploy-article-simplifier.yml
    secrets: inherit

  deploy-image-generator:
    uses: ./.github/workflows/deploy-image-generator.yml
    secrets: inherit

  deploy-text-to-speech:
    uses: ./.github/workflows/deploy-text-to-speech.yml
    secrets: inherit

  deploy-instagram-publisher:
    uses: ./.github/workflows/deploy-instagram-publisher.yml
    secrets: inherit

  # Orchestrator must deploy last - it resolves URLs/keys of all other functions
  deploy-orchestrator:
    needs:
      - deploy-rss-processor
      - deploy-article-simplifier
      - deploy-image-generator
      - deploy-text-to-speech
      - deploy-instagram-publisher
    uses: ./.github/workflows/deploy-orchestrator.yml
    secrets: inherit
