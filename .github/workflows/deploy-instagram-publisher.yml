name: Deploy InstagramPublisher

on:
  push:
    branches:
      - master
    paths:
      - 'lambdas/InstagramPublisher/**'
      - '.github/workflows/deploy-instagram-publisher.yml'
  workflow_dispatch:

env:
  DOTNET_VERSION: '8.0.x'
  AZURE_RESOURCE_GROUP: 'ai-newspaper-rg'
  AZURE_FUNCTIONAPP_NAME: 'ai-newspaper-instagram-publisher'
  BLOB_CONTAINER_NAME: 'batch-runs'
  INSTAGRAM_API_VERSION: 'v24.0'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Login to Azure
      uses: azure/login@v2
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    - name: Build InstagramPublisher
      run: |
        cd lambdas/InstagramPublisher
        dotnet restore
        dotnet build --configuration Release
        dotnet publish --configuration Release --output ./output

    - name: Deploy to Azure Function App
      uses: Azure/functions-action@v1
      with:
        app-name: ${{ env.AZURE_FUNCTIONAPP_NAME }}
        package: lambdas/InstagramPublisher/output

    - name: Configure App Settings
      run: |
        az functionapp config appsettings set \
          --name ${{ env.AZURE_FUNCTIONAPP_NAME }} \
          --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
          --settings \
            "INSTAGRAM_ACCESS_TOKEN=${{ secrets.INSTAGRAM_ACCESS_TOKEN }}" \
            "INSTAGRAM_ACCOUNT_ID_12=${{ secrets.INSTAGRAM_ACCOUNT_ID_12 }}" \
            "INSTAGRAM_ACCOUNT_ID_16=${{ secrets.INSTAGRAM_ACCOUNT_ID_16 }}" \
            "INSTAGRAM_API_VERSION=${{ env.INSTAGRAM_API_VERSION }}" \
            "BLOB_CONTAINER_NAME=${{ env.BLOB_CONTAINER_NAME }}"

        az functionapp cors add \
          --name ${{ env.AZURE_FUNCTIONAPP_NAME }} \
          --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
          --allowed-origins https://portal.azure.com

    - name: Logout from Azure
      run: az logout
      if: always()
